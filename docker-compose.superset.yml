version: '3.8'

services:
  superset:
    image: apache/superset:latest
    container_name: atmosync-superset
    restart: unless-stopped
    user: "root"
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "atmosync_secret_key_for_microclimate_arbitrage_analytics_2026"
      TALISMAN_ENABLED: "False"
    command: >
      bash -c "
        pip install snowflake-sqlalchemy &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@atmosync.io --password admin &&
        superset db upgrade &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "
